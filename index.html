<style>
:root{--green:#172923;--gold:#D9A43B;--cream:#F8F2E7;--dark:#101D18;--ease:cubic-bezier(.2,.7,.1,1);
  color-scheme:dark;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--dark);color:var(--cream);font-family:'Cairo','DM Sans',sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.bg{position:fixed;inset:0;z-index:0;background:
  radial-gradient(ellipse 60% 45% at 50% -5%,rgba(217,164,59,.28),transparent 70%),
  radial-gradient(ellipse 50% 50% at 100% 0,#1f3a30,transparent 70%),
  linear-gradient(180deg,#172923,#101D18 60%)}
.bg svg{position:absolute;inset:-5%;width:110%;height:110%;fill:none;stroke:var(--gold);stroke-width:1.6;opacity:.2;
  transition:transform .6s ease-out;animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{translate:0 -18px}}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 20%,rgba(16,29,24,.85) 85%)}
main{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:clamp(2.5rem,7vh,4.5rem) 1.2rem 2rem}
.en{font-family:'DM Sans',sans-serif;direction:ltr;unicode-bidi:isolate}
.brand{text-align:center}
.logo{font-weight:900;font-size:clamp(3.2rem,9vw,5.2rem);line-height:1.15;letter-spacing:-.01em}
.logo i{font-style:normal;color:var(--gold)}
.logo small{font-weight:300;color:rgba(248,242,231,.7);font-size:.72em}
.tag{margin-top:.4rem;font-size:.72rem;letter-spacing:.42em;text-transform:uppercase;font-weight:700;color:var(--gold);padding-inline-start:.42em}
.slogan{margin-top:.7rem;font-weight:600;font-size:1.05rem}
.rule{display:block;width:44px;height:2px;margin:1.8rem auto 0;background:var(--gold);transform-origin:center}
.list{width:min(100%,416px);margin-top:2.6rem;display:flex;flex-direction:column;gap:.85rem}
.card{display:flex;align-items:center;gap:1rem;padding:1rem 1.1rem;border:1px solid rgba(248,242,231,.12);border-radius:14px;
  background:linear-gradient(135deg,rgba(248,242,231,.06),rgba(248,242,231,.015));backdrop-filter:blur(6px);
  transition:transform .5s var(--ease),border-color .4s,background .4s,box-shadow .5s}
.card.hl{border-color:rgba(217,164,59,.65)}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 14px 40px -14px rgba(217,164,59,.45);
  background:linear-gradient(135deg,rgba(217,164,59,.14),rgba(248,242,231,.02))}
.ic{flex:none;width:46px;height:46px;border-radius:11px;display:grid;place-items:center;border:1px solid rgba(248,242,231,.14);background:rgba(16,29,24,.7);transition:transform .5s var(--ease)}
.ic svg{width:22px;height:22px}
.hl .ic{background:var(--gold);color:var(--dark);border-color:var(--gold)}
.card:hover .ic{transform:rotate(-8deg) scale(1.08)}
.tx{flex:1;display:flex;flex-wrap:wrap;align-items:baseline;gap:.15rem .6rem;line-height:1.5}
.tx b{font-family:'DM Sans',sans-serif;font-weight:700;font-size:1.02rem}
.tx span{font-size:.8rem;opacity:.65}
.chev{width:16px;height:16px;opacity:.6;flex:none;transition:transform .5s var(--ease),opacity .3s}
.card:hover .chev{transform:translateX(-6px);opacity:1;color:var(--gold)}
footer{margin-top:auto;padding-top:3rem;text-align:center;font-size:.78rem}
footer p{opacity:.85}
footer .en.s{display:block;margin-top:.3rem;font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;opacity:.5}
footer .loc{display:block;margin-top:.9rem;font-size:.7rem;opacity:.4}
.a{opacity:0;transform:translateY(22px);animation:in 1s var(--ease) forwards;animation-delay:calc(var(--d)*.12s + .15s)}
@keyframes in{to{opacity:1;transform:none}}
.rule.a{transform:scaleX(0);animation-name:line}
@keyframes line{to{opacity:1;transform:scaleX(1)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
